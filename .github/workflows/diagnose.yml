name: Diagnose npm token
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: whoami (which account does the token represent)
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_TOKEN }}
      - name: token sees @juli-os org packages?
        run: |
          echo "--- npm access ls-packages juli-os ---"
          npm access ls-packages juli-os || echo "EXIT=$?"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_TOKEN }}
      - name: token sees @juli-labs org packages?
        run: npm access ls-packages juli-labs || echo "EXIT=$?"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_TOKEN }}
      - name: raw registry org package list (status codes only)
        run: |
          for org in juli-os juli-labs; do
            code=$(curl -s -o /tmp/out.json -w "%{http_code}" -H "Authorization: Bearer $NODE_AUTH_TOKEN" "https://registry.npmjs.org/-/org/$org/package")
            echo "$org -> HTTP $code body=$(head -c 200 /tmp/out.json)"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_TOKEN }}
