name: Diagnose npm token
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: account profile (2FA / email verification)
        run: npm profile get || echo "EXIT=$?"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_TOKEN }}
      - name: org membership as seen by THIS token
        run: npm org ls juli-os || echo "EXIT=$?"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_TOKEN }}
      - name: raw whoami endpoint
        run: curl -s -H "Authorization: Bearer $NODE_AUTH_TOKEN" https://registry.npmjs.org/-/whoami; echo
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_TOKEN }}
